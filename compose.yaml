services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION}
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  api:
    build: .
    env_file: .env
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_SQS_INPUT_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      AWS_SQS_OUTPUT_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      AWS_SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      OIDC_JWKS_URL: http://keycloak:8081/realms/apostas/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  pgdata:
